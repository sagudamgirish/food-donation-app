<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - NourishNet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-lg p-4 rounded-4">
        <h3 class="fw-bold text-center text-success mb-2">NourishNet</h3>
        <p class="text-center text-muted small mb-4">Log in to manage your donations & claims</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="alert alert-{{cat}} p-2 small text-center">{{msg}}</div>
            {% endfor %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Sign In</button>
            <div class="text-center">
                <a href="/register" class="small text-decoration-none">Don't have an account? Register</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
