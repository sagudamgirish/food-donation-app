<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - NourishNet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">
<div class="container" style="max-width: 480px;">
    <div class="card border-0 shadow-lg p-4 rounded-4">
        <h3 class="fw-bold text-center text-success mb-2">Create Account</h3>
        <p class="text-center text-muted small mb-4">Join NourishNet as a Donor or Receiver</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="alert alert-{{cat}} p-2 small text-center">{{msg}}</div>
            {% endfor %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <select name="role" class="form-select fw-semibold" required>
                    <option value="" disabled selected>Select Your Role</option>
                    <option value="donor">🏪 Restaurant / Food Donor</option>
                    <option value="receiver">🏠 Food Receiver (NGO / Shelter / Orphanage)</option>
                </select>
            </div>
            <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="Full / Organization Name" required></div>
            <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Email Address" required></div>
            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
            <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required></div>
            <div class="mb-3"><input type="text" name="address" class="form-control" placeholder="Address / Location" required></div>
            <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Register Now</button>
            <div class="text-center"><a href="/login" class="small text-decoration-none">Already registered? Log In</a></div>
        </form>
    </div>
</div>
</body>
</html>
